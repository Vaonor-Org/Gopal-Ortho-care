<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Profile — Gopal Ortho Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0a6ebd;
  --primary-dark: #07528e;
  --primary-light: #e8f4fd;
  --primary-ul: #f0f7fd;
  --gold: #c8973a;
  --gold-light: #fbf5ea;
  --bg: #f4f7fb;
  --bg-dark: #041c30;
  --bg-darker: #020f1c;
  --surface: #ffffff;
  --surface-card: #f8fafc;
  --text-dark: #0f2338;
  --text-med: #475569;
  --text-light: #94a3b8;
  --border: #e2e8f0;
  --border-focus: #0a6ebd;
  --success: #16a34a;
  --success-bg: #f0fdf4;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --error: #dc2626;
  --error-bg: #fef2f2;
}

[data-theme="dark"] {
  --bg: #091522;
  --surface: #0e2236;
  --surface-card: #0b1a2b;
  --text-dark: #f1f5f9;
  --text-med: #94a3b8;
  --text-light: #64748b;
  --border: #1a334d;
  --primary-ul: rgba(10,110,189,.15);
  --primary-light: rgba(10,110,189,.2);
  --gold-light: rgba(200,151,58,.15);
  --success-bg: rgba(22,163,74,.15);
  --warning-bg: rgba(217,119,6,.15);
  --error-bg: rgba(220,38,38,.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text-dark); min-height: 100vh; display: flex; transition: background .2s, color .2s; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

:root {
  --sidebar-w: 240px;
}

/* ── SIDEBAR ── */
#sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--bg-dark); color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 200; overflow-y: auto; transform: translateX(-100%); transition: transform .25s cubic-bezier(.4,0,.2,1); }
body:not(.sidebar-collapsed) #sidebar { transform: translateX(0); }
body.sidebar-collapsed #sidebar { transform: translateX(-100%); }
body.sidebar-collapsed #main { margin-left: 0; }
@media (min-width: 961px) {
  body:not(.sidebar-collapsed) #sidebar { transform: translateX(0); }
  body:not(.sidebar-collapsed) #main { margin-left: var(--sidebar-w); }
  body.sidebar-collapsed #sidebar { transform: translateX(-100%); }
  body.sidebar-collapsed #main { margin-left: 0; }
}
@media (max-width: 960px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left: 0 !important; }
}

.sidebar__header { padding: 1.25rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.07); }
.sidebar__logo { display: flex; align-items: center; gap: .75rem; text-decoration: none; color: #fff; }
.sidebar__logo-icon { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(10,110,189,.35); flex-shrink: 0; }
.sidebar__logo-text { font-size: .95rem; font-weight: 700; line-height: 1.2; }
.sidebar__logo-text .gopal { color: #fff; display: block; letter-spacing: .02em; }
.sidebar__logo-text .ortho { color: rgba(255,255,255,.45); font-size: .65rem; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }

.sidebar__nav { padding: .75rem .625rem; display: flex; flex-direction: column; gap: .25rem; flex: 1; }
.nav-item { display: flex; align-items: center; gap: .75rem; padding: .6rem .75rem; border-radius: 8px; color: rgba(255,255,255,.65); text-decoration: none; font-size: .85rem; font-weight: 500; transition: all .15s ease; position: relative; }
.nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-item.active { background: var(--primary); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(10,110,189,.4); }
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nav-divider { height: 1px; background: rgba(255,255,255,.07); margin: .5rem 0; }

.sidebar__footer { padding: .875rem .625rem; border-top: 1px solid rgba(255,255,255,.07); }
.user-pill { display: flex; align-items: center; gap: .625rem; padding: .5rem; border-radius: 8px; background: rgba(255,255,255,.05); }
.user-pill__avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; flex-shrink: 0; }
.user-pill__name { font-size: .8rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── MAIN LAYOUT ── */
#main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left .25s cubic-bezier(.4,0,.2,1); }
.topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 50; }
.topbar__left { display: flex; align-items: center; gap: 1rem; }
.topbar__right { display: flex; align-items: center; gap: .75rem; }
#sidebar-toggle-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-med); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; }
#sidebar-toggle-btn:hover { background: var(--bg); color: var(--text-dark); }
.topbar-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-med); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; }
.topbar-btn:hover { background: var(--bg); color: var(--text-dark); }
.content-wrap { padding: 1.5rem; flex: 1; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: .25rem; padding: .2rem .55rem; border-radius: 6px; font-size: .75rem; font-weight: 600; }
.badge-male { background: var(--primary-ul); color: var(--primary); }
.badge-female { background: rgba(225,29,72,.12); color: #e11d48; }
.badge-other { background: rgba(139,92,246,.12); color: #8b5cf6; }

/* Print Styles */
@media print {
  #sidebar, .topbar, .profile-topbar, .btn-outline-action, .btn-primary-action, .modal, .modal-overlay { display: none !important; }
  body, #main, .content-wrap { background: #fff !important; color: #000 !important; padding: 0 !important; width: 100% !important; }
  .patient-hero-card, .content-wrap > div > div { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; }
}

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(4,28,48,.6); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal-card { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 480px; box-shadow: 0 20px 45px rgba(0,0,0,.25); overflow: hidden; }

/* Spinner */
.loading-spinner { border: 3px solid rgba(10,110,189,.15); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="sidebar-collapsed">

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside id="sidebar">
  <div class="sidebar__header">
    <a href="overview.html" class="sidebar__logo">
      <div class="sidebar__logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z" fill="rgba(255,255,255,.15)" stroke="white" stroke-width="1.5"/><path d="M9 12h6M12 9v6" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="sidebar__logo-text"><span class="gopal">GOPAL</span><span class="ortho">Ortho Care</span></div>
    </a>
  </div>
  <nav class="sidebar__nav" style="margin-top:.75rem;">
    <a id="nav-overview" href="overview.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span>Overview</span>
    </a>
    <a id="nav-reception" href="reception.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      <span>Reception Record</span>
    </a>
    <a id="nav-dashboard" href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Patient Records</span>
    </a>
    <a id="nav-room" href="room.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Room Management</span>
    </a>
    <a id="nav-bill" href="bill.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      <span>Billing</span>
    </a>
    <a id="nav-noticeboard" href="noticeboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Notice Board</span>
    </a>
    <div class="nav-divider"></div>
    <a id="nav-settings" href="settings.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 012.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Settings</span>
    </a>
  </nav>
  <div class="sidebar__footer">
    <div class="user-pill">
      <div class="user-pill__avatar" id="user-avatar">DR</div>
      <div style="flex:1;min-width:0;">
        <div class="user-pill__name" id="user-name-display">Doctor</div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      const saved = localStorage.getItem('displayName');
      if (saved && saved.trim()) {
        const av = document.getElementById('user-avatar');
        const nd = document.getElementById('user-name-display');
        if (av) av.textContent = saved.trim().slice(0,2).toUpperCase();
        if (nd) nd.textContent = saved.trim();
      }
    })();
  </script>
</aside>

<!-- ═══════════════ MAIN CONTENT ═══════════════ -->
<div id="main">
  <header class="topbar">
    <div class="topbar__left">
      <button id="sidebar-toggle-btn" onclick="window.toggleSidebar()" title="Toggle Sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <h2 style="font-size:1.1rem;font-weight:700;color:var(--text-dark);">Patient Profile</h2>
    </div>
    <div class="topbar__right">
      <button class="topbar-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="content-wrap">
    <div id="patient-profile-content"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, deleteDoc, collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { loadPatientProfile } from "./patient-profile.js";

const firebaseConfig = {
  apiKey: "AIzaSyAdNlPMX-YL7DzJZmPYOWQiMmYdSlkSGLs",
  authDomain: "gopalorthocare-e97cf.firebaseapp.com",
  projectId: "gopalorthocare-e97cf",
  storageBucket: "gopalorthocare-e97cf.firebasestorage.app",
  messagingSenderId: "263458525081",
  appId: "1:263458525081:web:78c763dac387f9ab4bcd08",
  measurementId: "G-3EHZ3EQFHL"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const authFB = getAuth(app);

// Theme Toggle
window.toggleTheme = () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('admin-theme', next);
};

const savedTheme = localStorage.getItem('admin-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);

// Auth Gate
onAuthStateChanged(authFB, async user => {
  if (!user) {
    window.location.href = window.location.hostname === 'admin.gopalorthocare.com' ? '/login' : 'login.html';
    return;
  }
  const displayName = user.displayName || (user.email||'Doctor').split('@')[0];
  const savedName = localStorage.getItem('displayName') || displayName;
  localStorage.setItem('displayName', savedName);
  const av = document.getElementById('user-avatar');
  const nd = document.getElementById('user-name-display');
  if (av) av.textContent = savedName.slice(0,2).toUpperCase();
  if (nd) nd.textContent = savedName;

  // Read ?id= or ?op= from URL
  const urlParams = new URLSearchParams(window.location.search);
  const patientId = urlParams.get('id');
  const opNo = urlParams.get('op');

  await loadPatientProfile({
    db,
    fs: { doc, getDoc, updateDoc, deleteDoc, collection, getDocs, query, where, orderBy, limit },
    patientId,
    opNo,
    containerId: 'patient-profile-content'
  });
});
</script>
<script>
// Sidebar Toggle
window.toggleSidebar = () => {
  if (window.innerWidth > 960) {
    document.body.classList.toggle('sidebar-collapsed');
  } else {
    document.getElementById('sidebar')?.classList.toggle('open');
  }
};

// Clean URL handler & sidebar auto-close
(function() {
  const isCustom = window.location.hostname === 'admin.gopalorthocare.com';
  if (isCustom) {
    const map = {
      'nav-overview': '/overview',
      'nav-reception': '/reception',
      'nav-dashboard': '/dashboard',
      'nav-room': '/room',
      'nav-bill': '/bill',
      'nav-noticeboard': '/noticeboard',
      'nav-settings': '/settings'
    };
    Object.entries(map).forEach(([id, path]) => {
      const el = document.getElementById(id);
      if (el) el.setAttribute('href', path);
    });
  }

  // Always close sidebar when navigating
  document.querySelectorAll('.nav-item, .sidebar__logo').forEach(item => {
    item.addEventListener('click', () => {
      document.body.classList.add('sidebar-collapsed');
      const sb = document.getElementById('sidebar');
      if (sb) sb.classList.remove('open');
    });
  });

  // Close sidebar if clicking outside
  document.addEventListener('click', (e) => {
    const sb = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle-btn');
    if (window.innerWidth <= 960) {
      if (sb && sb.classList.contains('open') && !sb.contains(e.target) && (!toggleBtn || !toggleBtn.contains(e.target))) {
        sb.classList.remove('open');
      }
    } else {
      if (sb && !document.body.classList.contains('sidebar-collapsed') && !sb.contains(e.target) && (!toggleBtn || !toggleBtn.contains(e.target))) {
        document.body.classList.add('sidebar-collapsed');
      }
    }
  });
})();
</script>
</body>
